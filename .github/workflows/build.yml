name: Build apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Keep CI cheap and fast (on private repos GitHub bills macOS minutes 10×, Windows 2×): a push
# builds only the apps whose files changed; keywords in the FIRST LINE of the commit message:
# "[smoke]" / "[screenshots]" run the smoke tests, "[desktop]" the macOS / Linux desktop builds,
# "[all]" builds every app, "[release]" does all of that and publishes a release (as do v* tags).
jobs:
  # Which apps this push touches: a push builds only the platforms whose files changed (the
  # workflow itself, "[all]", "[release]", tags and manual runs build everything).
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
      android: ${{ steps.diff.outputs.android }}
      desktop: ${{ steps.diff.outputs.desktop }}
      webos: ${{ steps.diff.outputs.webos }}
      release: ${{ steps.diff.outputs.release }}
      smoke: ${{ steps.diff.outputs.smoke }}
      screenshots: ${{ steps.diff.outputs.screenshots }}
      desktop_builds: ${{ steps.diff.outputs.desktop_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Keywords count only in the first line of the commit message (bodies may mention them).
          subject=$(printf '%s\n' "$MESSAGE" | head -n 1)
          flag() { if [[ "$subject" == *"$2"* ]]; then echo "$1=true"; else echo "$1=false"; fi; }
          tag=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag=true; fi
          {
            if [ "$tag" = true ]; then echo release=true; else flag release '[release]'; fi
            if [ "$tag" = true ]; then echo smoke=true; else
              if [[ "$subject" == *"[smoke]"* || "$subject" == *"[screenshots]"* || "$subject" == *"[release]"* ]]; then
                echo smoke=true; else echo smoke=false; fi
            fi
            flag screenshots '[screenshots]'
            if [ "$tag" = true ] || [[ "$subject" == *"[release]"* || "$subject" == *"[desktop]"* ]]; then
              echo desktop_builds=true; else echo desktop_builds=false; fi
          } | tee -a "$GITHUB_OUTPUT"
          all=false
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/tags/* ]] \
            || [[ "$subject" == *"[all]"* ]] || [[ "$subject" == *"[release]"* ]]; then
            all=true
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            all=true
          fi
          files=""
          if [ "$all" = false ]; then files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); fi
          echo "$files"
          check() {
            if [ "$all" = true ] || printf '%s\n' "$files" | grep -qE "$2"; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            check ios '^(DVDYoutube/|DVDTubeWidget/|Config/|DVDYoutube\.xcodeproj/|\.github/)'
            check android '^(android/|\.github/)'
            check desktop '^(windows/|\.github/)'
            check webos '^(webos/|windows/src/|\.github/)'
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build unsigned IPA
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DVDYoutube.xcodeproj \
            -scheme DVDYoutube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -quiet \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DVDYoutube.app Payload/
          zip -qry DVDTube-unsigned.ipa Payload
          ls -lh DVDTube-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-unsigned-ipa
          path: DVDTube-unsigned.ipa
          retention-days: 7

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  android:
    name: Build Android APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (release, signed with the sideload key)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="1.0.${GITHUB_RUN_NUMBER}" -PappVersionCode="${GITHUB_RUN_NUMBER}" 2>&1 | tee gradle.log

      - name: Show compile errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |^w: .*(deprecat|unchecked)|What went wrong|error:" gradle.log | grep -v "^w:" | head -150 || true

      # The key in the repo leaked when the repo became public. APKs are signed with a new key from
      # the repo secrets plus an APK Signature Scheme v3 rotation proof from the old key, so Android 9+
      # installs them over existing installs (keeping data) and stops accepting the old key.
      - name: Sign with the new key (key rotation)
        env:
          NEW_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          NEW_PASS: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          IS_RELEASE: ${{ needs.changes.outputs.release }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ -z "${NEW_KEY:-}" ] || [ -z "${NEW_PASS:-}" ]; then
            echo "::warning::ANDROID_SIGNING_KEY / ANDROID_SIGNING_PASSWORD are not set: the APK keeps the old key."
            if [ "$IS_RELEASE" = "true" ]; then echo "::error::Releases must be signed with the new key."; exit 1; fi
            cp "$apk" DVDTube.apk
            ls -lh DVDTube.apk
            exit 0
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apksigner from $bt"
          work=$(mktemp -d)
          printf '%s' "$NEW_KEY" | base64 -d > "$work/new.jks"
          old=(--ks android/app/dvdtube-sideload.jks --ks-key-alias dvdtube --ks-pass pass:dvdtube)
          new=(--ks "$work/new.jks" --ks-key-alias dvdtube --ks-pass env:NEW_PASS)
          "$bt/apksigner" rotate --out "$work/lineage" --old-signer "${old[@]}" --new-signer "${new[@]}"
          # Updates signed only by the leaked old key must not install over existing data.
          "$bt/apksigner" lineage --in "$work/lineage" --out "$work/lineage" --signer "${old[@]}" --set-installed-data false
          "$bt/apksigner" lineage --in "$work/lineage" --print-certs
          "$bt/apksigner" sign "${old[@]}" --next-signer "${new[@]}" --lineage "$work/lineage" \
            --rotation-min-sdk-version 28 --out DVDTube.apk "$apk"
          "$bt/apksigner" verify -v --print-certs DVDTube.apk | grep -vi "warning" | head -40
          rm -rf "$work"
          ls -lh DVDTube.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-apk
          path: DVDTube.apk
          retention-days: 7

  windows:
    name: Build Windows app
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build installer and portable zip
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          npx electron-vite build
          npx electron-builder --win --x64 --publish never

      - name: Collect
        shell: bash
        run: |
          ls -la dist
          mkdir -p ../win-out
          cp dist/DVDTube-Setup.exe ../win-out/DVDTube-Setup.exe
          cp dist/DVDTube-*-x64.zip ../win-out/DVDTube-Windows-portable.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-windows
          path: win-out/
          retention-days: 7

  macos:
    name: Build macOS app
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.desktop_builds == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dmg and zip (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          npx electron-vite build
          npx electron-builder --mac --x64 --arm64 --publish never

      - name: Collect
        run: |
          ls -la dist
          mkdir -p ../mac-out
          cp dist/DVDTube-mac-*.dmg ../mac-out/

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-macos
          path: mac-out/
          retention-days: 7

  linux:
    name: Build Linux app
    needs: changes
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.desktop_builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage and deb
        run: |
          npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          npx electron-vite build
          npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Collect
        run: |
          ls -la dist
          mkdir -p ../linux-out
          cp dist/DVDTube-linux-x86_64.AppImage dist/DVDTube-linux-amd64.deb ../linux-out/

      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-linux
          path: linux-out/
          retention-days: 7

  webos:
    name: Build LG webOS app
    needs: changes
    if: needs.changes.outputs.webos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: APP_VERSION="1.0.${GITHUB_RUN_NUMBER}" npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke test (service + UI in headless Chromium)
        if: needs.changes.outputs.smoke == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Package IPK
        run: |
          APP_VERSION="1.0.${GITHUB_RUN_NUMBER}" npm run package
          ls -la dist
          mkdir -p ../webos-out
          cp dist/DVDTube-webOS.ipk ../webos-out/

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-webos
          path: webos-out/
          retention-days: 7

      - name: Upload smoke results
        if: always() && needs.changes.outputs.smoke == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webos-smoke-results
          path: webos/dist/smoke/
          retention-days: 5

  # Publishes a GitHub Release with the IPA, APK, desktop apps and the webOS IPK: for a pushed v* tag, or for a push whose
  # commit message contains "[release]" (the tag v1.0.<run number> is then created here).
  release:
    name: Publish release
    if: needs.changes.outputs.release == 'true'
    needs: [changes, build, android, windows, macos, linux, webos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with IPA and APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
        run: |
          gh release create "$TAG" artifacts/DVDTube-unsigned.ipa artifacts/DVDTube.apk \
            artifacts/DVDTube-Setup.exe artifacts/DVDTube-Windows-portable.zip \
            artifacts/DVDTube-mac-arm64.dmg artifacts/DVDTube-mac-x64.dmg \
            artifacts/DVDTube-linux-x86_64.AppImage artifacts/DVDTube-linux-amd64.deb \
            artifacts/DVDTube-webOS.ipk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "DVDTube $TAG" \
            --notes "IPA chưa ký cho iPhone (cài bằng SideStore, AltStore, Sideloadly…), APK cho Android điện thoại và Android TV, DVDTube-Setup.exe (bộ cài) và DVDTube-Windows-portable.zip (bản chạy không cần cài) cho Windows 10/11, DVDTube-mac-arm64.dmg (Mac chip Apple) / DVDTube-mac-x64.dmg (Mac Intel), DVDTube-linux-x86_64.AppImage / .deb cho Linux, DVDTube-webOS.ipk cho TV LG webOS 5.0 trở lên (cài bằng Developer Mode) — xem README. Tải thẳng APK bản mới nhất: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/DVDTube.apk — bộ cài Windows mới nhất: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/DVDTube-Setup.exe"

  windows-smoke:
    name: Windows smoke test
    needs: [changes, windows]
    if: needs.changes.outputs.desktop == 'true' && needs.changes.outputs.smoke == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DVDTube-windows
          path: win-out

      - name: Run app scenarios
        shell: pwsh
        timeout-minutes: 10
        run: |
          Expand-Archive win-out/DVDTube-Windows-portable.zip -DestinationPath app
          $out = Join-Path $PWD 'smoke-windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath 'app/DVDTube.exe' -ArgumentList "--smoke=$out" -PassThru -Wait
          if (Test-Path "$out/report.json") { Get-Content "$out/report.json" }
          if (Test-Path "$out/main.log") { Get-Content "$out/main.log" -Tail 80 }
          exit $p.ExitCode

      # Opt-in (commit message contains "[screenshots]"), like the iOS smoke test.
      - name: Publish screenshots branch
        if: always() && needs.changes.outputs.screenshots == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke-windows
          rm -rf userdata
          git init -q -b ci-screenshots-windows
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Windows smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-windows

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-results
          path: |
            smoke-windows/
            !smoke-windows/userdata/
          retention-days: 5

  android-smoke:
    name: Android emulator smoke test
    needs: [changes, android]
    if: needs.changes.outputs.android == 'true' && needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DVDTube-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/android-smoke.sh

      # Opt-in (commit message contains "[screenshots]"), like the iOS smoke test.
      - name: Publish screenshots branch
        if: always() && needs.changes.outputs.screenshots == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke-android
          git init -q -b ci-screenshots-android
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Android smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-android

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-results
          path: smoke-android/
          retention-days: 5

  smoke:
    name: Simulator smoke test
    needs: changes
    if: needs.changes.outputs.ios == 'true' && needs.changes.outputs.smoke == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DVDYoutube.xcodeproj \
            -scheme DVDYoutube \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      - name: Run app scenarios
        run: .github/scripts/smoke.sh

      # Opt-in (commit message contains "[screenshots]"): publish results to a throwaway
      # branch so they can be fetched with plain git. Pushes made with GITHUB_TOKEN
      # do not trigger new workflow runs.
      - name: Publish screenshots branch
        if: always() && needs.changes.outputs.screenshots == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke/
          retention-days: 5
