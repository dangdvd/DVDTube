appId: com.dangdvd.dvdtube
productName: DVDTube
copyright: DVDTube
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  # Local test media for the mock mode (scripts/make-test-media.sh), never shipped.
  - "!out/renderer/dev/**"
  - package.json
# Icons and thumbar glyphs, read at runtime from process.resourcesPath/resources.
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
extraMetadata:
  main: out/main/index.js
win:
  icon: build/icon.ico
  executableName: DVDTube
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: DVDTube-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DVDTube
  artifactName: DVDTube-Setup.${ext}
  deleteAppDataOnUninstall: false
# macOS: unsigned dmg + zip for Intel and Apple silicon (icon made from build/icon.png).
mac:
  icon: build/icon.png
  category: public.app-category.video
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: DVDTube-mac-${arch}.${ext}
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  extendInfo:
    NSLocalNetworkUsageDescription: DVDTube tìm TV và máy tính có DVDTube trong cùng mạng Wi-Fi để truyền video, đồng bộ thư viện và đăng nhập bằng điện thoại.
    NSBonjourServices:
      - _dvdtube._tcp
dmg:
  artifactName: DVDTube-mac-${arch}.${ext}
# Linux: AppImage + deb (x64).
linux:
  icon: build/icon.png
  category: AudioVideo
  executableName: dvdtube
  synopsis: Xem YouTube không quảng cáo
  description: DVDTube — xem YouTube không quảng cáo, nghe nhạc, tải video và truyền tới TV.
  maintainer: dangdvd <dangdvd@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  artifactName: DVDTube-linux-x86_64.${ext}
deb:
  artifactName: DVDTube-linux-amd64.${ext}
protocols:
  - name: DVDTube
    schemes: [dvdtube]
publish: null
