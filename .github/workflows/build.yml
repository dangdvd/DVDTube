name: Build apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DVDYoutube.xcodeproj \
            -scheme DVDYoutube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DVDYoutube.app Payload/
          zip -qry DVDTube-unsigned.ipa Payload
          ls -lh DVDTube-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-unsigned-ipa
          path: DVDTube-unsigned.ipa
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (release, signed with the sideload key)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log

      - name: Show compile errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |^w: .*(deprecat|unchecked)|What went wrong|error:" gradle.log | grep -v "^w:" | head -150 || true

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DVDTube.apk
          ls -lh DVDTube.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-apk
          path: DVDTube.apk
          retention-days: 30

  windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build installer and portable zip
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          npx electron-vite build
          npx electron-builder --win --x64 --publish never

      - name: Collect
        shell: bash
        run: |
          ls -la dist
          mkdir -p ../win-out
          cp dist/DVDTube-Setup.exe ../win-out/DVDTube-Setup.exe
          cp dist/DVDTube-*-x64.zip ../win-out/DVDTube-Windows-portable.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-windows
          path: win-out/
          retention-days: 30

  # Publishes a GitHub Release with the IPA, APK and Windows installer: for a pushed v* tag, or for a push whose
  # commit message contains "[release]" (the tag v1.0.<run number> is then created here).
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    needs: [build, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with IPA and APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
        run: |
          gh release create "$TAG" artifacts/DVDTube-unsigned.ipa artifacts/DVDTube.apk \
            artifacts/DVDTube-Setup.exe artifacts/DVDTube-Windows-portable.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "DVDTube $TAG" \
            --notes "IPA chưa ký cho iPhone (cài bằng SideStore, AltStore, Sideloadly…), APK cho Android điện thoại và Android TV, DVDTube-Setup.exe (bộ cài) và DVDTube-Windows-portable.zip (bản chạy không cần cài) cho Windows 10/11 — xem README. Tải thẳng APK bản mới nhất: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/DVDTube.apk — bộ cài Windows mới nhất: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/DVDTube-Setup.exe"

  windows-smoke:
    name: Windows smoke test
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DVDTube-windows
          path: win-out

      - name: Run app scenarios
        shell: pwsh
        timeout-minutes: 10
        run: |
          Expand-Archive win-out/DVDTube-Windows-portable.zip -DestinationPath app
          $out = Join-Path $PWD 'smoke-windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath 'app/DVDTube.exe' -ArgumentList "--smoke=$out" -PassThru -Wait
          if (Test-Path "$out/report.json") { Get-Content "$out/report.json" }
          if (Test-Path "$out/main.log") { Get-Content "$out/main.log" -Tail 80 }
          exit $p.ExitCode

      # Opt-in (commit message contains "[screenshots]"), like the iOS smoke test.
      - name: Publish screenshots branch
        if: always() && contains(github.event.head_commit.message, '[screenshots]')
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke-windows
          rm -rf userdata
          git init -q -b ci-screenshots-windows
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Windows smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-windows

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-results
          path: |
            smoke-windows/
            !smoke-windows/userdata/
          retention-days: 14

  android-smoke:
    name: Android emulator smoke test
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DVDTube-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/android-smoke.sh

      # Opt-in (commit message contains "[screenshots]"), like the iOS smoke test.
      - name: Publish screenshots branch
        if: always() && contains(github.event.head_commit.message, '[screenshots]')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke-android
          git init -q -b ci-screenshots-android
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Android smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-android

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-results
          path: smoke-android/
          retention-days: 14

  smoke:
    name: Simulator smoke test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DVDYoutube.xcodeproj \
            -scheme DVDYoutube \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      - name: Run app scenarios
        run: .github/scripts/smoke.sh

      # Opt-in (commit message contains "[screenshots]"): publish results to a throwaway
      # branch so they can be fetched with plain git. Pushes made with GITHUB_TOKEN
      # do not trigger new workflow runs.
      - name: Publish screenshots branch
        if: always() && contains(github.event.head_commit.message, '[screenshots]')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke/
          retention-days: 14
