name: Build iOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DVDYoutube.xcodeproj \
            -scheme DVDYoutube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DVDYoutube.app Payload/
          zip -qry DVDTube-unsigned.ipa Payload
          ls -lh DVDTube-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-unsigned-ipa
          path: DVDTube-unsigned.ipa
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" DVDTube-unsigned.ipa \
            --title "DVDTube $GITHUB_REF_NAME" \
            --notes "Tệp IPA chưa ký. Cài bằng AltStore, SideStore, Sideloadly hoặc TrollStore — xem README."

  smoke:
    name: Simulator smoke test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DVDYoutube.xcodeproj \
            -scheme DVDYoutube \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      - name: Run app scenarios
        run: .github/scripts/smoke.sh

      # Opt-in (commit message contains "[screenshots]"): publish results to a throwaway
      # branch so they can be fetched with plain git. Pushes made with GITHUB_TOKEN
      # do not trigger new workflow runs.
      - name: Publish screenshots branch
        if: always() && contains(github.event.head_commit.message, '[screenshots]')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke/
          retention-days: 14
