name: Build apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DVDYoutube.xcodeproj \
            -scheme DVDYoutube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DVDYoutube.app Payload/
          zip -qry DVDTube-unsigned.ipa Payload
          ls -lh DVDTube-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-unsigned-ipa
          path: DVDTube-unsigned.ipa
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (release, signed with the sideload key)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log

      - name: Show compile errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |^w: .*(deprecat|unchecked)|What went wrong|error:" gradle.log | grep -v "^w:" | head -150 || true

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DVDTube.apk
          ls -lh DVDTube.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DVDTube-apk
          path: DVDTube.apk
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with IPA and APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/DVDTube-unsigned.ipa artifacts/DVDTube.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "DVDTube $GITHUB_REF_NAME" \
            --notes "IPA chưa ký cho iPhone (cài bằng SideStore, AltStore, Sideloadly…) và APK cho Android — xem README."

  android-smoke:
    name: Android emulator smoke test
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DVDTube-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/android-smoke.sh

      # Opt-in (commit message contains "[screenshots]"), like the iOS smoke test.
      - name: Publish screenshots branch
        if: always() && contains(github.event.head_commit.message, '[screenshots]')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke-android
          git init -q -b ci-screenshots-android
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Android smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-android

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-results
          path: smoke-android/
          retention-days: 14

  smoke:
    name: Simulator smoke test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project DVDYoutube.xcodeproj \
            -scheme DVDYoutube \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      - name: Run app scenarios
        run: .github/scripts/smoke.sh

      # Opt-in (commit message contains "[screenshots]"): publish results to a throwaway
      # branch so they can be fetched with plain git. Pushes made with GITHUB_TOKEN
      # do not trigger new workflow runs.
      - name: Publish screenshots branch
        if: always() && contains(github.event.head_commit.message, '[screenshots]')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd smoke
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Smoke test results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke/
          retention-days: 14
